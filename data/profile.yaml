# Content for the profile page (layouts/partials/index_profile.html)

articles:
  - year: 2026
    venue: Telecommunications Policy
    title: "Big data, small answers: How the DSA Transparency Database falls short of its regulatory objectives"
    summary: >-
      Platforms in the EU must log every content moderation decision in the DSA Transparency Database.
      We ask whether this enormous dataset delivers the transparency the Digital Services Act promises
      — and find that it mostly does not.
    authors: "<strong>Groesch, S.</strong>, Birrer, A., Just, N., &amp; Saurwein, F."
    url: https://doi.org/10.1016/j.telpol.2025.103088

