<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    /* In a dark browser tab bar a black disc would vanish: give it a faint
       light rim there. In light mode it stays a plain black circle. */
    @media (prefers-color-scheme: dark) { .disc { stroke: #fff; stroke-opacity: .4; } }
  </style>
  <circle class="disc" cx="32" cy="32" r="30" fill="#000" stroke-width="2"/>
  <circle cx="32" cy="32" r="7" fill="#fff"/>
</svg>
